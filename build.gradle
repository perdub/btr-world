plugins { id 'fabric-loom' version '1.7.4'; id 'maven-publish' }
version = providers.gradleProperty('mod_version').get()
group = 'dev.aliska'
base { archivesName = 'btr-world' }
repositories { maven { url = 'https://maven.nucleoid.xyz/' } }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.10'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.102.1+1.21.1'
 modImplementation 'eu.pb4:polymer-core:0.9.18+1.21.1'
 modImplementation 'eu.pb4:polymer-blocks:0.9.18+1.21.1'
 modImplementation 'eu.pb4:polymer-resource-pack:0.9.18+1.21.1'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
