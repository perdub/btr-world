name: Build and publish mod

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mod-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Determine build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=${BASE_VERSION}+build.${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Test release verification
        run: python3 -m unittest discover -s tests -v
      - name: Validate authored resources
        run: python3 scripts/validate_assets.py
      - name: Build mod
        env:
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: bash ./gradlew --no-daemon build "-Pmod_version=$MOD_VERSION"
      - name: Prepare assets with stable names
        run: python3 scripts/prepare_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: mod-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mod-release-assets
          path: release-assets
      - name: Publish complete release and mark it latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MOD_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # A rerun of an old commit must not replace the current latest build.
          BRANCH_SHA="$(gh api "repos/$GH_REPO/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')"
          if [[ "$BRANCH_SHA" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is on the default branch; publication skipped."
            exit 0
          fi
          TAG="build-${GITHUB_RUN_ID}-${GITHUB_SHA:0:7}"
          python3 - <<'PY'
          import os
          from pathlib import Path
          base=f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
          text=(f"Автоматическая сборка **{os.environ['MOD_VERSION']}** для Minecraft Java 1.21.1.\n\n"
                f"Коммит: `{os.environ['GITHUB_SHA']}`.\n\n"
                "Нужны Java 21, Fabric, Fabric API и Polymer bundled 0.9.18+1.21.1.\n\n"
                f"Постоянная ссылка: {base}/releases/latest/download/btr-world.jar\n\n"
                "Автоматическая beta-сборка. Репетиции 90–150 секунд; оригинальные нотные мелодии. Игровое поведение не проверяется CI.\n")
          Path('release-notes.md').write_text(text, encoding='utf-8')
          PY
          if gh release view "$TAG" --json isDraft > existing-release.json 2>/dev/null; then
            if [[ "$(python3 -c 'import json; print(json.load(open("existing-release.json"))["isDraft"])')" == 'False' ]]; then
              echo "This run already has a published release."
              exit 0
            fi
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --draft \
              --target "$GITHUB_SHA" --title "BTR World — мир «Одинокого рокера» $MOD_VERSION" \
              --notes-file release-notes.md
          fi
          gh release edit "$TAG" --draft=false --latest \
            --title "BTR World — мир «Одинокого рокера» $MOD_VERSION" --notes-file release-notes.md
          echo "### Скачать последнюю сборку" >> "$GITHUB_STEP_SUMMARY"
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download/btr-world.jar" >> "$GITHUB_STEP_SUMMARY"

  publish-modrinth:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.MODRINTH_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: mod-release-assets
          path: release-assets
      - name: Check current default-branch commit
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BRANCH_SHA="$(gh api "repos/$GH_REPO/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')"
          if [[ "$BRANCH_SHA" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Newer commit found; Modrinth publication skipped."
          fi
      - name: Prepare and check Modrinth publication
        id: modrinth
        if: steps.head.outputs.current == 'true'
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 scripts/modrinth_release.py prepare
      - name: Upload using Modrinth Publish
        if: steps.head.outputs.current == 'true' && steps.modrinth.outputs.exists != 'true'
        uses: cloudnode-pro/modrinth-publish@v2.5.2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ steps.modrinth.outputs.project }}
          version: ${{ steps.modrinth.outputs.version }}
          name: ${{ steps.modrinth.outputs.name }}
          changelog: ${{ steps.modrinth.outputs.changelog }}
          channel: beta
          status: listed
          environment: server_only_client_optional
          loaders: fabric
          game-versions: 1.21.1
          files: '["release-assets/btr-world.jar", "release-assets/btr-world-sources.jar"]'
          primary-file: btr-world.jar
          file-types: btr-world-sources.jar=sources-jar
          dependencies: ${{ steps.modrinth.outputs.dependencies }}
      - name: Read back version and verify uploaded files
        if: steps.head.outputs.current == 'true'
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 scripts/modrinth_release.py verify
